target:
  id: "readelf_7209"
  name: "GNU Binutils readelf (CVE-2017-7209 NULL Deref)"
  repo_url: "https://sourceware.org/git/binutils-gdb.git"
  commit: "binutils-2_28"
  vulnerability:
    type: "NULL Pointer Dereference"
    reference: "CVE-2017-7209 (Sourceware Bug 21135)"
    target_file: "readelf.c"
    target_line: "readelf.c:11628"

build:
  configure_cmd: "./configure --disable-werror --disable-shared --disable-gdb --disable-libdecnumber --disable-readline --disable-sim --disable-nls"
  make_cmd: "make -j$(nproc) all-binutils"
  binary_path: "binutils/readelf"
  sanitizer_flags: "-fsanitize=address"

fuzzing:
  target_args: "-w @@"
  input_type: "file"
  seed_dir: "seeds"
