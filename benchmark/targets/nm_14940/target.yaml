target:
  id: "nm_14940"
  name: "GNU Binutils nm (CVE-2017-14940 OOM/BOF)"
  repo_url: "https://sourceware.org/git/binutils-gdb.git"
  commit: "dd9a28c0966d13924fbd1096a724ae334954d830"
  vulnerability:
    type: "Out-Of-Memory / Heap Corruption"
    reference: "CVE-2017-14940"
    target_file: "elf.c"
    target_line: "elf.c:8205"

build:
  configure_cmd: "./configure --disable-werror --disable-shared --disable-gdb --disable-libdecnumber --disable-readline --disable-sim --disable-nls"
  make_cmd: "make -j$(nproc) all-binutils"
  binary_path: "binutils/nm-new"
  sanitizer_flags: "-fsanitize=address"

fuzzing:
  target_args: "-A -a -l -S -s --special-syms --synthetic -D @@"
  input_type: "file"
  seed_dir: "seeds"

