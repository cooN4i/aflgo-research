# ==============================================================================
# Custom Directed Fuzzing Benchmark Configuration
# ==============================================================================

benchmark:
  name: "DGF-Benchmark"
  version: "1.1.0"
  description: "Comparative benchmark for Directed Greybox Fuzzers on real-world vulnerabilities"

# ------------------------------------------------------------------------------
# Resource & Execution Limits
# ------------------------------------------------------------------------------
resources:
  cpu_per_trial: 1           # Pin exactly 1 CPU core per fuzzer instance
  memory_limit: "2g"         # Max RAM per container to prevent system freeze
  max_parallel_workers: 8    # Adjust according to available host CPU cores

experiment:
  duration: "24h"            # Fuzzing campaign duration per trial (12h as requested)
  trials: 1                  # Number of repetitions per (fuzzer, target) pair (10 trials)
  metric_poll_interval: 30   # Status and metric polling interval (seconds)

# ------------------------------------------------------------------------------
# Approved Evaluation Metrics
# ------------------------------------------------------------------------------
metrics:
  - id: "time_to_target"
    name: "Time-To-Target (TTT / T_reach)"
    description: "Wall-clock seconds to first target reach (T_reach) verified by GDB breakpoint"
    aggregation: ["median", "iqr"]

  - id: "execs_to_target"
    name: "Executions-To-Target (ETT / E_reach)"
    description: "Number of test executions performed before first target reach"
    aggregation: ["median", "iqr"]

  - id: "time_to_exposure"
    name: "Time-To-Exposure (TTE / T_trigger)"
    description: "Wall-clock seconds to first target bug trigger/crash (T_trigger) verified by ASan/GDB"
    aggregation: ["median", "iqr"]

  - id: "execs_to_exposure"
    name: "Executions-To-Exposure (ETE / E_trigger)"
    description: "Number of test executions performed before triggering target bug"
    aggregation: ["median", "iqr"]

  - id: "reach_rate"
    name: "Reach Rate"
    description: "Fraction of trials that successfully reached the target basic block within timeout"
    unit: "percentage"

  - id: "trigger_rate"
    name: "Trigger Rate"
    description: "Fraction of trials that successfully triggered the bug within timeout"
    unit: "percentage"

  - id: "distance_convergence"
    name: "Distance Convergence Rate"
    description: "Evolution of minimum and average distance d_min(t) over time"

  - id: "statistical_significance"
    name: "Mann-Whitney U Test & Vargha-Delaney A12"
    description: "Two-sided p-value and Vargha-Delaney A12 effect size against baseline"

# ------------------------------------------------------------------------------
# Competing Fuzzers
# ------------------------------------------------------------------------------
fuzzers:
  - id: "aflgo_mod"
    name: "AFLGo (Modified: Complexity & Dominators)"
    path: "fuzzers/aflgo_mod"
    type: "distance_based"
    baseline: false
    enabled: true

  - id: "aflgo_orig"
    name: "AFLGo (Vanilla)"
    path: "fuzzers/aflgo_orig"
    type: "distance_based"
    baseline: true
    enabled: false

  - id: "dafl"
    name: "DAFL (Selectivity & Score-based DGF)"
    path: "fuzzers/dafl"
    type: "selectivity_based"
    baseline: false
    enabled: false

  - id: "fishfuzz"
    name: "FishFuzz (Multi-distance & Dynamic Target Ranking)"
    path: "fuzzers/fishfuzz"
    type: "multi_distance"
    baseline: false
    enabled: false

  - id: "windranger"
    name: "WindRanger (Deviation Basic Blocks DGF)"
    path: "fuzzers/windranger"
    type: "deviation_based"
    baseline: false
    enabled: false

# ------------------------------------------------------------------------------
# Benchmark Targets (Empirically Verified Targets: Anchor + 4 Medium-Hard Targets)
# ------------------------------------------------------------------------------
targets:
  - id: "cxxfilt"
    name: "GNU Binutils cxxfilt (CVE-2016-4487 Demangle Invalid Free)"
    path: "targets/cxxfilt"
    enabled: true

  - id: "readelf_7209"
    name: "GNU Binutils readelf (CVE-2017-7209 DWARF Reloc NULL Deref)"
    path: "targets/readelf_7209"
    enabled: true

  - id: "jasper_5221"
    name: "JasPer jasper (CVE-2015-5221 MIF Double Free)"
    path: "targets/jasper_5221"
    enabled: true

  - id: "objdump_8392"
    name: "GNU Binutils objdump (CVE-2017-8392 DWARF Heap Over-read)"
    path: "targets/objdump_8392"
    enabled: true

  - id: "cjpeg_14498"
    name: "libjpeg-turbo cjpeg (CVE-2018-14498 BMP Heap Over-read)"
    path: "targets/cjpeg_14498"
    enabled: true
